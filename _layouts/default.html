<!doctype html>
<html lang="{{ site.lang | default: 'ru-RU' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#f4f6f8">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* Standalone stylesheet; no theme dependency. */
:root {
  color-scheme: light;
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-soft: #edf1f5;
  --text: #101a2a;
  --muted: #657186;
  --line: #dce3eb;
  --accent: #087e72;
  --accent-strong: #05675e;
  --accent-soft: #d8f3ed;
  --ink-on-accent: #ffffff;
  --hero-panel: #101e2b;
  --hero-panel-text: #eef6f7;
  --shadow: 0 24px 60px rgba(24, 42, 63, .07);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c121b;
  --surface: #121c28;
  --surface-soft: #182432;
  --text: #edf3fa;
  --muted: #9aabc0;
  --line: #263444;
  --accent: #5ed6c0;
  --accent-strong: #8be4d3;
  --accent-soft: #153c39;
  --ink-on-accent: #071b19;
  --hero-panel: #172b38;
  --hero-panel-text: #eef6f7;
  --shadow: 0 24px 60px rgba(0, 0, 0, .16);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 88px; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.65; transition: background .2s ease, color .2s ease; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.skip-link { position: absolute; left: 16px; top: -64px; z-index: 100; background: var(--surface); color: var(--text); padding: 10px 14px; border-radius: 10px; }
.skip-link:focus { top: 12px; }
.site-header { width: min(1160px, calc(100% - 48px)); height: 88px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; }
.brand-mark { display: flex; align-items: center; justify-content: center; overflow: hidden; width: 42px; height: 42px; border-radius: 13px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 800; letter-spacing: -.06em; }
.brand-text { display: flex; flex-direction: column; font-size: 13px; font-weight: 800; line-height: 1.25; }
.brand-text small { margin-top: 4px; color: var(--muted); font: 9px 'DM Mono', monospace; letter-spacing: .14em; }
.main-nav { display: flex; align-items: center; justify-content: center; gap: clamp(15px, 2vw, 30px); }
.main-nav a { margin: 0 5px; font-size: 12px; font-weight: 700; color: var(--muted); transition: color .18s ease; }
.main-nav a:hover { color: var(--accent); }
.header-actions { display: flex; align-items: center; gap: 11px; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 50%; cursor: pointer; font-size: 17px; }
.header-cta { font-size: 12px; font-weight: 800; white-space: nowrap; }
.header-cta span { color: var(--accent); margin-left: 4px; }
.page-shell { max-width: 1160px; margin: 0 auto; padding: 0 0 24px; }
.section-wrap { width: calc(100% - 48px); margin-left: auto; margin-right: auto; }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); gap: clamp(36px, 7vw, 94px); align-items: center; padding-top: 78px; padding-bottom: 94px; }
.eyebrow { margin: 0 0 18px; color: var(--accent); font: 500 10px 'DM Mono', monospace; letter-spacing: .16em; }
.eyebrow-dot { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 12px; font-size: clamp(46px, 6.5vw, 78px); line-height: .99; letter-spacing: -.075em; font-weight: 800; }
h1 span, .contact-copy h2 span { color: var(--accent); }
.full-name { margin: 0 0 20px; color: var(--muted); font-size: 13px; letter-spacing: .01em; }
.hero-summary { max-width: 530px; color: var(--muted); font-size: 16px; line-height: 1.85; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 27px; }
.hero-actions .button + .button { margin-left: 10px; }
.button { min-height: 45px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 0 17px; border-radius: 10px; border: 1px solid transparent; font-size: 12px; font-weight: 800; cursor: pointer; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
.button:hover { transform: translateY(-2px); }
.button-primary { background: var(--accent); color: var(--ink-on-accent); }
.button-primary:hover { background: var(--accent-strong); }
.button-quiet { color: var(--text); background: transparent; border-color: var(--line); }
.button-outline { color: var(--text); border-color: var(--line); background: var(--surface); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 34px; color: var(--muted); font: 10px 'DM Mono', monospace; letter-spacing: .04em; }
.meta-mark { margin-right: 7px; color: var(--accent); font-size: 15px; }
.profile-panel { position: relative; overflow: hidden; padding: 31px; border-radius: 24px; background: var(--hero-panel); color: var(--hero-panel-text); min-height: 375px; box-shadow: var(--shadow); }
.profile-panel::after { content: ''; position: absolute; width: 220px; height: 220px; right: -100px; top: -100px; border: 1px solid rgba(94, 214, 192, .22); border-radius: 50%; box-shadow: 0 0 0 28px rgba(94, 214, 192, .035), 0 0 0 56px rgba(94, 214, 192, .025); pointer-events: none; }
.avatar { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; width: 75px; height: 75px; border-radius: 22px; margin-bottom: 27px; background: linear-gradient(135deg, #5ed6c0, #79b8ff); color: #10252e; font-size: 25px; font-weight: 800; letter-spacing: -.08em; }
.panel-kicker { margin-bottom: 11px; color: #82d8cb; font: 10px 'DM Mono', monospace; letter-spacing: .16em; }
.profile-panel h2 { position: relative; z-index: 1; margin-bottom: 14px; font-size: 26px; line-height: 1.2; letter-spacing: -.04em; }
.panel-description { max-width: 350px; margin-bottom: 21px; color: #bdcad4; font-size: 12px; line-height: 1.8; }
.panel-tags, .skill-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.panel-tags span { padding: 5px 10px; border: 1px solid rgba(235, 246, 247, .18); border-radius: 20px; color: #e2f3f2; font: 10px 'DM Mono', monospace; }
.panel-link { display: flex; justify-content: space-between; align-items: center; margin-top: 27px; padding-top: 16px; border-top: 1px solid rgba(235, 246, 247, .16); color: #b4e6df; font-size: 11px; font-weight: 800; }
.content-section { padding-top: 55px; padding-bottom: 60px; border-top: 1px solid var(--line); }
.section-heading { max-width: 660px; margin-bottom: 30px; }
.section-heading .eyebrow { margin-bottom: 11px; }
.section-heading h2, .contact-copy h2 { margin-bottom: 10px; font-size: clamp(28px, 4vw, 40px); line-height: 1.15; letter-spacing: -.055em; }
.section-heading > p:not(.eyebrow), .section-heading-inline > p { color: var(--muted); font-size: 13px; }
.skills-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
.skill-card { position: relative; min-height: 180px; padding: 22px 20px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
.card-index { display: inline-flex; align-items: center; justify-content: center; width: 27px; height: 27px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font: 11px 'DM Mono', monospace; }
.skill-card h3 { margin: 22px 0 15px; font-size: 14px; letter-spacing: -.02em; }
.skill-chips span { padding: 5px 9px; border-radius: 6px; background: var(--surface-soft); color: var(--muted); font-size: 10px; line-height: 1.5; }
.section-heading-inline { display: flex; align-items: end; justify-content: space-between; gap: 28px; max-width: none; }
.section-heading-inline > p { max-width: 280px; margin-bottom: 13px; }
.project-card { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 25px; padding: 27px 0; border-top: 1px solid var(--line); }
.project-card:last-child { border-bottom: 1px solid var(--line); }
.project-number { color: var(--accent); font: 12px 'DM Mono', monospace; padding-top: 5px; }
.project-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; }
.project-title-row h3 { margin: 0; font-size: 22px; letter-spacing: -.04em; }
.project-type { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font: 9px 'DM Mono', monospace; }
.project-description { max-width: 780px; margin-bottom: 15px; color: var(--muted); font-size: 13px; line-height: 1.85; }
.project-details { width: fit-content; max-width: 100%; color: var(--muted); font-size: 11px; }
.project-details summary { color: var(--accent); cursor: pointer; font-weight: 800; }
.project-details:not([open]) > .details-content { display: none; }
.details-content { margin: 10px 0 4px; padding: 13px 15px; border-left: 2px solid var(--accent); background: var(--surface-soft); border-radius: 0 8px 8px 0; }
.details-content p { margin: 4px 0; }
.details-content strong { color: var(--text); }
.project-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
.text-link { color: var(--text); font-size: 11px; font-weight: 800; }
.text-link span { margin-left: 5px; color: var(--accent); }
.education-section { padding-bottom: 65px; }
.education-card { display: flex; align-items: flex-start; gap: 17px; padding: 25px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
.education-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 21px; }
.education-level { margin-bottom: 7px; color: var(--accent); font: 10px 'DM Mono', monospace; letter-spacing: .06em; }
.education-card h3 { margin-bottom: 6px; font-size: 18px; letter-spacing: -.035em; }
.muted { margin-bottom: 0; color: var(--muted); font-size: 11px; }
.contact-section { display: grid; grid-template-columns: 1fr 1fr; gap: 45px; align-items: center; padding: 42px; border-radius: 24px; background: var(--surface-soft); }
.contact-copy .eyebrow { margin-bottom: 14px; }
.contact-copy h2 { font-size: clamp(30px, 4vw, 44px); }
.contact-copy > p:last-child { max-width: 420px; margin-bottom: 0; color: var(--muted); font-size: 12px; }
.contact-email { display: inline-flex; align-items: center; gap: 16px; margin-bottom: 19px; font-size: clamp(18px, 2.4vw, 26px); font-weight: 800; letter-spacing: -.04em; }
.contact-email span { color: var(--accent); font-size: 18px; }
.contact-buttons { display: flex; flex-wrap: wrap; gap: 9px; }
.contact-buttons .button + .button { margin-left: 9px; }
.copy-status { min-height: 18px; margin: 9px 0 0; color: var(--accent); font-size: 11px; }
.page-footer { width: calc(100% - 48px); display: flex; justify-content: space-between; gap: 18px; margin: 26px auto 0; padding: 19px 0 0; border-top: 1px solid var(--line); color: var(--muted); font: 9px 'DM Mono', monospace; letter-spacing: .04em; }
.page-footer a { color: var(--accent); }
@media (max-width: 900px) {
  .site-header { gap: 15px; }
  .main-nav { gap: 12px; }
  .main-nav a { font-size: 10px; }
  .header-cta { display: none; }
  .hero { gap: 35px; grid-template-columns: 1fr minmax(260px, .8fr); padding-top: 60px; }
  .skills-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 650px) {
  html { scroll-padding-top: 20px; }
  .site-header { width: calc(100% - 32px); height: auto; min-height: 75px; flex-wrap: wrap; padding: 15px 0 12px; }
  .brand-mark { width: 38px; height: 38px; }
  .brand-text { font-size: 12px; }
  .main-nav { order: 3; width: 100%; justify-content: space-between; overflow-x: auto; padding: 9px 0 2px; }
  .main-nav a { margin: 0; white-space: nowrap; font-size: 10px; }
  .section-wrap, .page-footer { width: calc(100% - 32px); }
  .page-shell { padding-top: 0; }
  .hero { grid-template-columns: 1fr; padding-top: 52px; padding-bottom: 57px; }
  h1 { font-size: clamp(52px, 16vw, 76px); }
  .hero-summary { font-size: 14px; }
  .profile-panel { min-height: auto; padding: 25px; }
  .avatar { width: 64px; height: 64px; border-radius: 18px; }
  .content-section { padding-top: 42px; padding-bottom: 44px; }
  .skills-grid { grid-template-columns: 1fr; }
  .skill-card { min-height: auto; }
  .skill-card h3 { margin-top: 14px; }
  .section-heading-inline { align-items: flex-start; flex-direction: column; gap: 3px; }
  .section-heading-inline > p { margin-top: 0; }
  .project-card { grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 23px 0; }
  .project-title-row h3 { font-size: 19px; }
  .project-footer { align-items: flex-start; flex-direction: column; }
  .education-card { padding: 19px; }
  .education-card h3 { font-size: 15px; }
  .contact-section { grid-template-columns: 1fr; gap: 24px; width: calc(100% - 32px); padding: 25px 21px; border-radius: 18px; }
  .contact-email { font-size: 19px; }
  .page-footer { flex-wrap: wrap; font-size: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
@media print {
  :root, [data-theme="dark"] { --bg: #ffffff; --surface: #ffffff; --surface-soft: #f1f3f5; --text: #101a2a; --muted: #536074; --line: #dce3eb; --accent: #087e72; --accent-soft: #e1f5f0; }
  body { background: white; color: #101a2a; font-size: 10pt; }
  .site-header, .hero-actions, .header-actions, .main-nav, .skip-link, .contact-buttons, .copy-status, .page-footer a { display: none !important; }
  .page-shell { max-width: 100%; }
  .hero { padding: 20px 0 30px; gap: 24px; }
  .profile-panel { background: #101e2b !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .content-section { padding-top: 25px; padding-bottom: 25px; break-inside: avoid; }
  .skills-grid { grid-template-columns: repeat(2, 1fr); }
  .skill-card, .education-card, .project-card, .contact-section { break-inside: avoid; }
  .contact-section { margin-top: 20px; padding: 24px; }
  a { text-decoration: none; }
  a[href^="http"]::after { content: ""; }
  details:not([open]) > :not(summary) { display: block; }
  .page-footer { margin-top: 20px; }
}

  </style>
</head>
<body>
  <a class="skip-link" href="#top">Перейти к содержимому</a>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="На главную страницу резюме"><span class="brand-mark">ИЯ</span><span class="brand-text">Игорь Яшкузин<small>JAVA BACKEND DEVELOPER</small></span></a>
    <nav class="main-nav" aria-label="Основная навигация">
      <a href="#skills">Навыки</a><a href="#projects">Проекты</a><a href="#education">Образование</a><a href="#contact">Контакты</a>
    </nav>
    <div class="header-actions"><button class="icon-button" type="button" data-theme-toggle aria-label="Переключить цветовую тему" title="Переключить тему"><span data-theme-icon>◐</span></button><a class="header-cta" href="#contact">Связаться <span aria-hidden="true">↗</span></a></div>
  </header>
  {{ content }}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
